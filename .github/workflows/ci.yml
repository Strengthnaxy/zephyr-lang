name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  zig:
    name: Zig compiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - name: Build
        working-directory: zig
        run: zig build -Doptimize=ReleaseSafe

  rust:
    name: Rust installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        working-directory: rust
        run: cargo build --release

  cpp:
    name: C++ runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile runtime
        run: g++ -std=c++17 -c cpp/runtime.cpp -o /tmp/runtime.o

  php:
    name: PHP landing page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Lint
        run: php -l php/index.php

  ocaml:
    name: OCaml AST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.2'
      - name: Compile
        run: |
          cd ocaml
          ocamlfind ocamlopt -c zephyr_ast.ml || ocamlopt -c zephyr_ast.ml

  ruby:
    name: Ruby build helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Syntax check
        run: ruby -c ruby/build.rb
