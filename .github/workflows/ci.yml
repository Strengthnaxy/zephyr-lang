name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  zig:
    name: Zig compiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.17.0
      - name: Build
        working-directory: zig
        run: zig build -Doptimize=ReleaseSafe
